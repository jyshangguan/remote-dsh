# dsh-remote-panel-openssh bundle patch: inserts the dual-face plugin row into
# the web profile roster. The node half (exports ".") runs in the host process
# (OpenSSH sessions, tunnel, gateway, /api/remote-dsh-openssh routes); the
# `dsh.client` declaration in package.json makes the browser half (exports
# "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: remote-dsh-openssh
      name: dsh-remote-panel-openssh